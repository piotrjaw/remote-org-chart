name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.5'
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - run: npm ci --prefix assets
      - run: npm test --prefix assets
      - run: npm run lint --prefix assets
      - run: npm run build --prefix assets

  deploy:
    name: Trigger Render deployment
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Deploy the tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Configure the RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi
          # Do not retry: a timed-out request may already have started a deploy.
          # Suppress the response and curl diagnostics to keep the secret URL private.
          if ! curl --silent --fail --max-time 60 --request POST --output /dev/null \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"; then
            echo "::error::Render deployment could not be confirmed. Check Render before retrying."
            exit 1
          fi
          echo "Render accepted deployment of ${GITHUB_SHA}. Check Render for build and rollout status."
